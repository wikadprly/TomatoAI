# Jalankan seluruh stack: `docker compose up --build`
#
# Backend memakai CPU penuh saat inferensi; frontend memanggilnya lewat
# NEXT_PUBLIC_API_BASE_URL yang di-embed saat build (localhost dari sisi
# browser, bukan nama service Docker).
services:
  backend:
    build: ./backend
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      WARMUP_ENABLED: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
